<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="KathaVerse - Stories Beyond Imagination"
  >

  <title>KathaVerse — Stories Beyond Imagination</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->

  <header class="topbar">

    <button
      class="icon-btn menu-btn"
      onclick="toggleSidebar()"
      aria-label="Menu"
    >
      ☰
    </button>

    <div
      class="brand"
      onclick="navigate('home')"
    >
      <div class="brand-mark">K</div>

      <div>
        <div class="brand-name">
          KathaVerse
        </div>

        <div class="brand-tagline">
          Stories Beyond Imagination
        </div>
      </div>
    </div>

    <div class="top-actions">

      <button
        class="icon-btn"
        onclick="navigate('search')"
        title="Search"
      >
        🔍
      </button>

      <button
        class="profile-mini"
        onclick="navigate('profile')"
      >
        AS
      </button>

    </div>

  </header>


  <!-- SIDEBAR -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <div class="sidebar-inner">

      <button
        class="nav-item active"
        data-page="home"
        onclick="navigate('home')"
      >
        🏠
        <span>Home</span>
      </button>

      <button
        class="nav-item"
        data-page="explore"
        onclick="navigate('explore')"
      >
        🔎
        <span>Explore</span>
      </button>

      <button
        class="nav-item"
        data-page="stories"
        onclick="navigate('stories')"
      >
        📚
        <span>Stories</span>
      </button>

      <button
        class="nav-item"
        data-page="roleplay"
        onclick="navigate('roleplay')"
      >
        🎭
        <span>Roleplay</span>
      </button>

      <button
        class="nav-item"
        data-page="characters"
        onclick="navigate('characters')"
      >
        🤖
        <span>AI Characters</span>
      </button>

      <button
        class="nav-item"
        data-page="creator"
        onclick="navigate('creator')"
      >
        ✍️
        <span>Create Story</span>
      </button>

      <button
        class="nav-item"
        data-page="saved"
        onclick="navigate('saved')"
      >
        ❤️
        <span>Saved</span>
      </button>

      <button
        class="nav-item"
        data-page="community"
        onclick="navigate('community')"
      >
        👥
        <span>Community</span>
      </button>

      <button
        class="nav-item"
        data-page="levels"
        onclick="navigate('levels')"
      >
        🏆
        <span>100 Levels</span>
      </button>

      <button
        class="nav-item"
        data-page="premium"
        onclick="navigate('premium')"
      >
        💎
        <span>Premium</span>
      </button>

      <button
        class="nav-item"
        data-page="profile"
        onclick="navigate('profile')"
      >
        👤
        <span>Profile</span>
      </button>

      <button
        class="nav-item"
        data-page="reports"
        onclick="navigate('reports')"
      >
        🚩
        <span>My Reports</span>
      </button>

      <button
        class="nav-item"
        data-page="settings"
        onclick="navigate('settings')"
      >
        ⚙️
        <span>Settings</span>
      </button>

      <div class="sidebar-divider"></div>

      <button
        class="nav-item mature-nav"
        onclick="openMatureGate()"
      >
        🔞
        <span>30+ Mature</span>
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main
    id="mainContent"
    class="main"
  ></main>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- MODAL -->

  <div
    id="globalModal"
    class="modal-overlay hidden"
    onclick="closeModalOutside(event)"
  >

    <div
      id="modalBox"
      class="modal-box"
    ></div>

  </div>


  <!-- FOOTER -->

  <footer class="footer">

    <div class="footer-brand">
      KathaVerse
    </div>

    <div>
      Stories Beyond Imagination
    </div>

    <div>
      आपकी कहानी। आपकी दुनिया।
    </div>

    <div class="footer-copy">
      Created & Developed by Asheesh Sarkar
    </div>

  </footer>


  <script src="app.js"></script>

</body>
</html>
