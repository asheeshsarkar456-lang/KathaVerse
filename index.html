<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="description"
    content="KathaVerse — आपकी कहानी। आपकी दुनिया। Stories Beyond Imagination."
  >

  <meta name="theme-color" content="#08080d">

  <title>KathaVerse — Stories Beyond Imagination</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       APP HEADER
  ========================== -->

  <header class="top-header">

    <button
      class="menu-button"
      id="menuButton"
      aria-label="Open Menu"
    >
      ☰
    </button>

    <div
      class="brand"
      onclick="navigateTo('home')"
    >

      <div class="brand-logo">
        क
      </div>

      <div class="brand-text">

        <strong>KathaVerse</strong>

        <span>
          आपकी कहानी। आपकी दुनिया।
        </span>

      </div>

    </div>

    <div class="header-actions">

      <button
        class="header-button"
        onclick="navigateTo('search')"
        aria-label="Search"
      >
        🔍
      </button>

      <button
        class="profile-avatar"
        id="profileAvatar"
        onclick="navigateTo('profile')"
      >
        A
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN APP
  ========================== -->

  <div class="app-layout">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <nav class="sidebar-navigation">

        <button
          onclick="navigateTo('home')"
        >
          <span>⌂</span>
          <span>Home</span>
        </button>


        <button
          onclick="navigateTo('explore')"
        >
          <span>✦</span>
          <span>Explore</span>
        </button>


        <button
          onclick="navigateTo('stories')"
        >
          <span>📚</span>
          <span>Stories</span>
        </button>


        <button
          onclick="navigateTo('roleplay')"
        >
          <span>◈</span>
          <span>Roleplay</span>
        </button>


        <button
          onclick="navigateTo('characters')"
        >
          <span>♙</span>
          <span>AI Characters</span>
        </button>


        <button
          onclick="navigateTo('create')"
        >
          <span>＋</span>
          <span>Create Story</span>
        </button>


        <button
          onclick="navigateTo('saved')"
        >
          <span>♡</span>
          <span>Saved</span>
        </button>


        <button
          onclick="navigateTo('community')"
        >
          <span>☷</span>
          <span>Community</span>
        </button>


        <button
          onclick="navigateTo('levels')"
        >
          <span>★</span>
          <span>100 Levels</span>
        </button>


        <button
          onclick="navigateTo('premium')"
        >
          <span>♛</span>
          <span>Premium</span>
        </button>


        <button
          onclick="navigateTo('profile')"
        >
          <span>◉</span>
          <span>Profile</span>
        </button>

      </nav>


      <!-- SIDEBAR BOTTOM -->

      <div class="sidebar-bottom">

        <button
          onclick="navigateTo('reports')"
        >
          <span>⚑</span>
          <span>My Reports</span>
        </button>


        <button
          onclick="navigateTo('settings')"
        >
          <span>⚙</span>
          <span>Settings</span>
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main
      class="main-content"
      id="mainContent"
    >

      <!--
        JavaScript pages will load here.
      -->

      <div class="loading-screen">

        <div class="loading-logo">
          क
        </div>

        <h2>
          KathaVerse
        </h2>

        <p>
          Stories Beyond Imagination
        </p>

      </div>

    </main>

  </div>


  <!-- =========================
       GLOBAL TOAST
  ========================== -->

  <div
    class="toast"
    id="toast"
  ></div>


  <!-- =========================
       MODAL
  ========================== -->

  <div
    class="modal hidden"
    id="globalModal"
  >

    <div class="modal-content">

      <button
        class="modal-close"
        onclick="closeModal()"
      >
        ×
      </button>

      <div id="modalBody"></div>

    </div>

  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div>

      <strong>
        KathaVerse
      </strong>

      <span>
        — Stories Beyond Imagination
      </span>

    </div>

    <div>
      Created &amp; Developed by
      <strong>
        Asheesh Sarkar
      </strong>
    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
